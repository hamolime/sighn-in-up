<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back | Modern Login</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome Icons for inputs -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Background Glowing Orbs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Main Glass Container -->
  <div class="auth-card">
    <div class="brand">
      <i class="fa-solid fa-bolt brand-icon"></i>
      <h2>ApexAuth</h2>
    </div>

    <div class="auth-header">
      <h3>Welcome Back 👋</h3>
      <p>Enter your credentials to access your account</p>
    </div>

    <form class="auth-form" action="#">
      <div class="input-group">
        <i class="fa-regular fa-envelope input-icon"></i>
        <input type="email" placeholder="Email Address" required>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" placeholder="Password" required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="divider">
      <span>OR CONTINUE WITH</span>
    </div>

    <div class="social-login">
      <button class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
      <button class="social-btn"><i class="fa-brands fa-github"></i> GitHub</button>
    </div>

    <div class="auth-footer">
      <p>Don't have an account? <a href="register.html" class="switch-link">Create Account</a></p>
    </div>
  </div>

</body>
</html>

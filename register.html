<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Modern Register</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Background Glowing Orbs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Main Glass Container -->
  <div class="auth-card">
    <div class="brand">
      <i class="fa-solid fa-bolt brand-icon"></i>
      <h2>ApexAuth</h2>
    </div>

    <div class="auth-header">
      <h3>Create Account 🚀</h3>
      <p>Get started with your free account today</p>
    </div>

    <form class="auth-form" action="#">
      <div class="input-group">
        <i class="fa-regular fa-user input-icon"></i>
        <input type="text" placeholder="Full Name" required>
      </div>

      <div class="input-group">
        <i class="fa-regular fa-envelope input-icon"></i>
        <input type="email" placeholder="Email Address" required>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" placeholder="Password" required>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-shield-halved input-icon"></i>
        <input type="password" placeholder="Confirm Password" required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" required>
          <span>I agree to <a href="#" class="terms-link">Terms & Conditions</a></span>
        </label>
      </div>

      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <div class="divider">
      <span>OR SIGN UP WITH</span>
    </div>

    <div class="social-login">
      <button class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
      <button class="social-btn"><i class="fa-brands fa-github"></i> GitHub</button>
    </div>

    <div class="auth-footer">
      <p>Already have an account? <a href="login.html" class="switch-link">Sign In</a></p>
    </div>
  </div>

</body>
</html>
